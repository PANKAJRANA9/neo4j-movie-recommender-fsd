
version: '3.8'
services:
  neo4j:
    image: neo4j:5
    ports: ["7474:7474","7687:7687"]
    environment: NEO4J_AUTH=neo4j/password
    volumes: ["./neo4j_data:/data"]
  backend:
    build: ./backend
    ports: ["8080:8080"]
    depends_on: [neo4j]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
